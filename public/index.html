<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMS - Welcome</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Notification System -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Home View -->
    <div id="home-view" class="view-section active">
        <div class="hero glass-panel">
            <h1>Welcome to ShopMS 🛍️</h1>
            <p>Your premium marketplace management suite.</p>
            <div class="hero-actions">
                <button class="btn-primary" onclick="showView('auth-view', 'login')">Login</button>
                <button class="btn-secondary" onclick="showView('auth-view', 'signup')">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Auth View -->
    <div id="auth-view" class="view-section">
        <div class="auth-card glass-panel">
            <h2 id="auth-title">Login</h2>
            
            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="login_phone" required placeholder="Enter your phone number">
                </div>
                <button type="submit" class="btn-primary auth-submit">Login</button>
                <p class="auth-switch">New here? <a href="#" onclick="toggleAuth('signup')">Sign up</a></p>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" style="display: none;">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="reg_name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="reg_phone" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg_email">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="reg_address">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="reg_role" onchange="toggleShopOption()">
                            <option value="Customer">Customer</option>
                            <option value="Owner">Shop Owner</option>
                            <option value="Supplier">Supplier</option>
                        </select>
                    </div>
                </div>

                <div id="shop-option-div" style="display: none; margin-top: 15px;">
                    <label style="display:flex; align-items:center; gap: 8px;">
                        <input type="checkbox" id="reg_open_shop" onchange="toggleShopFields()">
                        Open a Shop Now?
                    </label>
                </div>

                <div id="shop-details-div" class="form-grid glass-panel" style="display: none; margin-top: 15px; padding: 15px;">
                    <div class="form-group">
                        <label>Shop Name</label>
                        <input type="text" id="reg_shop_name">
                    </div>
                    <div class="form-group">
                        <label>Shop Address</label>
                        <input type="text" id="reg_shop_address">
                    </div>
                </div>

                <button type="submit" class="btn-primary auth-submit" style="margin-top: 20px;">Sign Up</button>
                <p class="auth-switch">Already have an account? <a href="#" onclick="toggleAuth('login')">Login</a></p>
            </form>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="view-section">
        <div class="dashboard-container">
            <!-- Sidebar Navigation -->
            <aside class="sidebar glass-panel">
                <div class="sidebar-header">
                    <h2>ShopMS 🛍️</h2>
                    <p id="user-display-name" style="font-size: 0.85rem; color: var(--text-muted);"></p>
                </div>
                <nav class="sidebar-nav" id="sidebar-nav">
                    <!-- Javascript will inject context-aware navigation here -->
                </nav>
                <button class="btn-secondary" style="margin-top:auto;" onclick="logout()">Logout</button>
            </aside>

            <!-- Main Content Area -->
            <main class="main-content">
                <header class="main-header glass-panel">
                    <h1 id="page-title">Dashboard</h1>
                </header>

                <div class="content-body">
                    <!-- Dynamic Context Forms -->
                    <section class="form-section glass-panel" id="dynamic-form-section" style="display: none;">
                        <h3 id="form-heading">Add Record</h3>
                        <form id="data-form" class="dynamic-form">
                            <div id="form-fields" class="form-grid">
                                <!-- JS Will Inject Fields Here -->
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn-primary">Save Record</button>
                            </div>
                        </form>
                    </section>

                    <!-- Data Table -->
                    <section class="table-section glass-panel">
                        <h3 id="table-heading">Current Records</h3>
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr id="table-head">
                                        <!-- JS Will Inject Headings Here -->
                                    </tr>
                                </thead>
                                <tbody id="table-body">
                                    <tr>
                                        <td colspan="100%" class="loading-state">Loading data...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
