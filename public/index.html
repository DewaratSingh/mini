<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Weather AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-item">
            <span class="navbar-icon">📍</span>
            <div>
                <div class="navbar-label">Location</div>
                <div class="navbar-value" id="navLocation">--</div>
            </div>
        </div>
        <div class="navbar-item">
            <span class="navbar-icon">🌡️</span>
            <div>
                <div class="navbar-label">Temperature</div>
                <div class="navbar-value" id="navTemp">--°C</div>
            </div>
        </div>
        <div class="navbar-item">
            <span class="navbar-icon">💧</span>
            <div>
                <div class="navbar-label">Humidity</div>
                <div class="navbar-value" id="navHumidity">--%</div>
            </div>
        </div>
        <div class="navbar-item">
            <span class="navbar-icon">💨</span>
            <div>
                <div class="navbar-label">Wind</div>
                <div class="navbar-value" id="navWind">-- km/h</div>
            </div>
        </div>
        <div class="navbar-item">
            <span class="navbar-icon">😊</span>
            <div>
                <div class="navbar-label">Comfort</div>
                <div class="navbar-value" id="navComfort">--/100</div>
            </div>
        </div>
    </nav>

    <div class="orb" id="orb"></div>

    <div class="bubble" id="bubble">
        Tap mic & ask about weather 🎤
    </div>

    <button class="mic" id="micBtn">🎤</button>

    <button class="chat-toggle" id="chatToggle">💬</button>

    <div class="chat-panel hidden" id="chatPanel">
        <div class="chat-header">
            <h3>💬 Conversation History</h3>
            <button class="close-btn" id="closeChat">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-container">
            <input type="text" id="chatInput" placeholder="Type your question..." />
            <button id="chatSend">Send</button>
        </div>
    </div>

    <div class="location-modal" id="locationModal">
        <div class="modal-content">
            <div class="modal-icon">📍</div>
            <h2>Welcome to Jarvis!</h2>
            <p>I need your location for weather data</p>
            <button class="btn-primary" id="allowLocationBtn">Allow GPS</button>
            <button class="btn-secondary" id="manualLocationBtn">Enter City</button>
        </div>
    </div>

    <div class="location-input-modal hidden" id="locationInputModal">
        <div class="modal-content">
            <h2>Enter Your City</h2>
            <input type="text" id="cityInput" placeholder="e.g., London, Mumbai, Tokyo..." />
            <button class="btn-primary" id="submitCityBtn">Continue</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
